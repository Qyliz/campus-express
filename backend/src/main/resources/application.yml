spring:
  application:
    name: backend
  #配置数据源信息
  datasource:
    #配置数据源类型
    type: com.zaxxer.hikari.HikariDataSource
    #配置数据库链接
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_express?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false
    username: root
    password: Root
  #最大文件大小
  servlet:
    multipart:
      max-file-size: 5MB
  #日志颜色
  output:
    ansi:
      enabled: always

sa-token:
  #允许多人登录
  is-concurrent: false
  #输出日志
  is-log: true