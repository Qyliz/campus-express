spring:
  application:
    name: backend
  #配置数据源信息
  datasource:
    #配置数据源类型
    type: com.zaxxer.hikari.HikariDataSource
    #配置数据库链接
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_express?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false
    username: root
    password: Root
  #启动时执行建表脚本（幂等），保证数据库结构可复现
  sql:
    init:
      #对非内嵌库（MySQL）也执行初始化
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      #显式指定 UTF-8，避免 Windows 平台默认 GBK 导致脚本中的中文注释乱码
      encoding: UTF-8
  #最大文件大小
  servlet:
    multipart:
      max-file-size: 5MB
  #日志颜色
  output:
    ansi:
      enabled: always

sa-token:
  #允许多人登录
  is-concurrent: false
  #输出日志
  is-log: true