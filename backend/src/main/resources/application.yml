spring:
  application:
    name: backend
  #配置数据源信息
  datasource:
    #配置数据源类型
    type: com.zaxxer.hikari.HikariDataSource
    #配置数据库链接
    driver-class-name: com.mysql.cj.jdbc.Driver
    #allowPublicKeyRetrieval：MySQL 8 默认用 caching_sha2_password 认证，在 useSSL=false 的非加密连接下，
    #服务器重启后第一次握手需要取服务端 RSA 公钥；不开这个参数会报 Public Key Retrieval is not allowed。
    #仅本地开发无妨（localhost 不存在中间人），生产环境应当改用 SSL 而不是放开它。
    url: jdbc:mysql://localhost:3306/campus_express?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Root
  #启动时执行建表脚本（幂等），保证数据库结构可复现
  sql:
    init:
      #对非内嵌库（MySQL）也执行初始化
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      #显式指定 UTF-8，避免 Windows 平台默认 GBK 导致脚本中的中文注释乱码
      encoding: UTF-8
  #最大文件大小
  servlet:
    multipart:
      max-file-size: 5MB
  #日志颜色
  output:
    ansi:
      enabled: always

sa-token:
  #允许多人登录
  is-concurrent: false
  #输出日志
  is-log: true
